# Genera los recursos offline grandes UNA SOLA VEZ (ejecución manual, nunca programada)
# y los guarda en la rama "offline-assets". El workflow de CI los copia en cada despliegue.
# Así un despliegue futuro no depende de servicios externos.
#  - Extracto PMTiles del centro de Kioto (datos © OpenStreetMap, ODbL; teselas Protomaps).
name: Recursos offline

on:
  workflow_dispatch:
    inputs:
      map:
        description: Generar el extracto de mapa
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  map:
    if: inputs.map
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar go-pmtiles
        run: |
          curl -sSfL -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.28.0/go-pmtiles_1.28.0_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          ./pmtiles version
      - name: Extraer el centro de Kioto
        run: |
          BUILD=$(curl -sSf https://build-metadata.protomaps.dev/builds.json | jq -r '[.[] | .key] | sort | last')
          echo "Build de Protomaps: $BUILD"
          ./pmtiles extract "https://build.protomaps.com/$BUILD" kyoto-centro.pmtiles \
            --bbox=135.735,34.980,135.800,35.025 --maxzoom=15
          ./pmtiles show kyoto-centro.pmtiles
          echo "$BUILD" > kyoto-centro.source.txt
          ls -l kyoto-centro.pmtiles
      - uses: actions/upload-artifact@v4
        with:
          name: map
          path: |
            kyoto-centro.pmtiles
            kyoto-centro.source.txt

  publish:
    needs: [map]
    if: needs.map.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar la rama offline-assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin offline-assets >/dev/null 2>&1; then
            git fetch origin offline-assets
            git checkout -B offline-assets origin/offline-assets
          else
            git checkout --orphan offline-assets
            git rm -rf --quiet .
            git clean -fdx
          fi
          mkdir -p site
      - uses: actions/download-artifact@v4
        with:
          name: map
          path: site
      - name: Licencias y atribución
        run: |
          {
            echo "kyoto-centro.pmtiles: datos © colaboradores de OpenStreetMap, licencia ODbL 1.0 (https://www.openstreetmap.org/copyright)."
            echo "Teselas generadas por Protomaps (https://protomaps.com)."
          } > site/LICENCIAS.txt
      - name: Guardar en la rama offline-assets
        run: |
          git add site
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Recursos offline generados por el workflow (${{ github.run_id }})"
          git push origin offline-assets
